<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celebration Explosion</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0c0c0c; /* Dark background */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      overflow: hidden;
    }

    /* Button styles */
    button {
      font-size: 24px;
      padding: 15px 30px;
      border: none;
      background-color: #00ccff;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
    }

    button:focus {
      outline: none;
    }

    /* Star styles */
    .star {
      position: absolute;
      width: 20px;
      height: 20px;
      opacity: 0;
      animation: starExplosion 1.5s forwards;
      pointer-events: none;
    }

    .star svg {
      fill: gold;
      width: 100%;
      height: 100%;
    }

    /* Explosion effect */
    @keyframes starExplosion {
      0% {
        opacity: 1;
        transform: scale(1) translate(0, 0);
      }
      100% {
        opacity: 0;
        transform: scale(1.5) translate(var(--x), var(--y));
      }
    }

  </style>
</head>
<body>

  <button id="celebrateButton">Celebrate!</button>

  <script>
    const button = document.getElementById('celebrateButton');

    button.addEventListener('click', () => {
      createStarExplosion(event);
    });

    function createStarExplosion(event) {
      const numberOfStars = 10; // Number of stars in the explosion
      const buttonRect = button.getBoundingClientRect(); // Get button position

      for (let i = 0; i < numberOfStars; i++) {
        const star = document.createElement('div');
        star.classList.add('star');
        
        const xOffset = Math.random() * 400 - 200; // Random X offset
        const yOffset = Math.random() * 400 - 200; // Random Y offset
        star.style.setProperty('--x', `${xOffset}px`);
        star.style.setProperty('--y', `${yOffset}px`);

        // SVG star shape
        star.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M12 17.4l5.6 3.3-1.5-6.2 4.8-4.3-6.3-.5L12 2l-2 6.7-6.3.5 4.8 4.3-1.5 6.2L12 17.4z"/>
          </svg>
        `;

        // Position the star at the button's center
        star.style.left = `${buttonRect.left + buttonRect.width / 2 - 10}px`;
        star.style.top = `${buttonRect.top + buttonRect.height / 2 - 10}px`;

        document.body.appendChild(star);

        // Remove the star after animation
        setTimeout(() => {
          star.remove();
        }, 1500);
      }
    }
  </script>
</body>
</html>
